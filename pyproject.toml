[project]
name = "agentic-radar"
version = "0.1.0"
description = "A set of AI agents that finds unsolved problems of the agentic transition, sourced from people describing them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
